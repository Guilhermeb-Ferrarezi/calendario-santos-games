server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    return 301 /campeonatos/;
  }

  location /campeonatos/ {
    try_files $uri $uri/ /campeonatos/index.html;
  }

  location ~* ^/campeonatos/.*\.(?:js|css|png|jpg|jpeg|gif|svg|ico|avif|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
